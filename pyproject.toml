# Analyzers for scripts/ (the screenshot renderer). Go analysis lives in
# staticcheck.conf and the Makefile.

[tool.uv]
# Floor matching CI's setup-uv pin (.github/workflows/ci.yml). `make scripts-check`
# also enforces it so an older uv fails with a named message instead of an
# unknown-flag traceback.
required-version = ">=0.12.6"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["scripts"]
required-version = ">=0.16.4"

[tool.ruff.lint]
select = [
    "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "DTZ", "E", "EM", "F",
    "FA", "FLY", "I", "ICN", "ISC", "PERF", "PIE", "PLE", "PLR091", "PLW",
    "PYI", "RET", "RSE", "RUF", "S", "SIM", "SLOT", "TC", "TRY", "UP", "YTT",
]
