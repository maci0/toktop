# Analyzers for scripts/ (the screenshot renderer). Go analysis lives in
# staticcheck.conf and the Makefile.

[tool.uv]
# Floor matching CI's setup-uv pin (.github/workflows/ci.yml). `make scripts-check`
# also enforces it so an older uv fails with a named message instead of an
# unknown-flag traceback.
required-version = ">=0.12.6"

# py312, the interpreter .python-version pins and the one [tool.mypy]
# checks against below. A lower target lets the linters pass syntax and
# stdlib moves the pinned interpreter accepts, and it is the floor that
# decides which rewrite rules apply, so the two must name the same version.

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["scripts"]
required-version = ">=0.16.4"

[tool.ruff.lint]
# Every group the tree passes, not a curated subset: ERA catches code parked
# in comments, TD/FIX keep deferred work visible, SLF catches reaching into
# privates, FURB catches the rewrite-it-properly patterns, PTH keeps path
# work on pathlib, G keeps logging calls lazy, INP keeps a module importable
# without an __init__.py. A group absent from this list runs its default set
# and nothing more.
#
# T20 is the one group left out, and it is the one the tree cannot pass:
# this is a command-line renderer whose output is the product, and T20 flags
# every print, which is how a CLI talks. The docstring (D), trailing comma
# (COM), annotation-only import (TCH) and copyright (CPY) sets are all
# selected; the convention note below is what lets D run without a
# mutual-exclusion warning.
select = [
    "A", "AIR", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "COM", "C90", "CPY", "D",
    "DTZ", "E", "EM", "ERA", "EXE", "F", "FA", "FAST", "FBT", "FIX", "FLY",
    "FURB", "G", "I", "ICN", "INP", "INT", "ISC", "LOG", "N", "NPY", "PD", "PERF",
    "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PTH", "PYI", "Q", "RET", "RSE",
    "RUF", "S", "SIM", "SLF", "SLOT", "T10", "TC", "TCH", "TD", "TID", "TRY",
    "UP", "W", "YTT",
]
# COM812 wants a trailing comma on the last element of a multi-line call, and
# black decides that instead. Selected together, ruff prints a conflict
# warning on every run of `make scripts-check` and in CI, over a rule the
# formatter already settles. The rest of COM is formatter-independent
# (COM818 flags a trailing comma that adds nothing, COM819 a prohibited one)
# and stays on.
ignore = ["COM812"]

[tool.ruff.lint.pydocstyle]
# The docstrings here use Google sections (Args:, Returns:, Raises:), which is
# what the convention fixes. Without it ruff warns that D203/D211 and D212/D213
# are mutually exclusive on every run, and a warning nobody acts on is noise
# that trains people to skip the output.
convention = "google"

# The type checker. ruff's ANN set only proves an annotation is spelled; nothing
# in the tree checked that the annotation was true, so a renamed pyte or pillow
# attribute passed every other gate. strict is the whole set: untyped defs,
# implicit Optional, Any returns and unchecked dict access all off. The tree
# passes it today with no per-module overrides, so nothing is ratcheted.
#
# `scripts` is the only package that has stubs or inline annotations to check,
# and it is what src above already scopes ruff to, so the two agree on which
# files are analyzed.
[tool.mypy]
python_version = "3.12"
files = ["scripts"]
strict = true
# A silent pass is the failure this gate exists to prevent: a bad path, a
# missing config section or an unresolved import must be a non-zero exit, not a
# run that simply found nothing to say.
warn_unreachable = true
