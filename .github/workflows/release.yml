name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    # vet-cross analyzes six platforms, the race tests run both sqlite halves,
    # and the reproducibility gate builds two platforms twice from cold build
    # caches. 45 minutes covers the three together with the build of every
    # release platform.
    timeout-minutes: 45
    env:
      LC_ALL: C
      TZ: UTC
      GOAMD64: v1
      GOARM64: v8.0
      CGO_ENABLED: "0"
      GOFLAGS: ""
      GOEXPERIMENT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: refuse a version that is already published
        # A moved tag re-runs this job and would otherwise replace the binaries,
        # checksums and SBOM under a version people have already installed and
        # verified, so a download and its recorded checksum stop agreeing. The
        # tag is a version, not a branch: it is cut once and left alone. This
        # runs before the gates so a duplicate fails without building.
        # A publish that failed before the release existed leaves nothing here,
        # so a retry is still allowed.
        # gh reads a token from the environment, never from the git config
        # checkout writes (persist-credentials is off), so without GH_TOKEN
        # every call here fails on auth and the guard passes anything.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh release view "$GITHUB_REF_NAME" 2>&1); then
            echo "$GITHUB_REF_NAME is already published; cut a new version instead" >&2
            exit 1
          fi
          # Only "this version was never published" is allowed through. An auth
          # failure, a rate limit or an outage must not read as a free version.
          case "$out" in
            *"HTTP 404"*|*"not found"*) ;;
            *)
              echo "cannot tell whether $GITHUB_REF_NAME is published:" >&2
              printf '%s\n' "$out" >&2
              exit 1
              ;;
          esac

      - name: vet and staticcheck before shipping (every release platform)
        # Per-platform gate lives in the Makefile; PLATFORMS there is the
        # single source of truth so CI and local checks cannot drift apart.
        run: make vet-cross

      - name: test before shipping
        # make test covers both halves of the sqlite tag gate; the artifacts
        # below are built with TAGS=sqlite, so shipping without that half would
        # leave the linked driver untested in this job.
        run: make test

      # The Makefile promises byte-identical artifacts from identical source.
        # The pull-request `repro` job guards main, but a tag push runs here
        # only, so the bytes about to be published have to be compared in the
        # job that publishes them. repro-check-pair is the target the PR gate
        # runs over the Makefile's REPRO_PLATFORMS, so this job and that one
        # cannot drift onto different platforms; the full sweep is local.
      - name: reproducibility gate (REPRO_PLATFORMS)
        run: make repro-check-pair

      - name: build all platforms
        id: build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Tag names reach ldflags and dist filenames; refuse anything that
          # is not a safe identifier so a v* glob cannot inject the recipe.
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._+-]+$'; then
            echo "refusing to release from tag '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          prerelease=false
          if [[ "${VERSION%%+*}" == *-* ]]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          # Platform list, checksum generation and deterministic archive
          # metadata live in the Makefile so local and CI releases cannot
          # drift apart.
          make release VERSION="$VERSION"
          # smoke test the host-platform artifact: proves the binary runs,
          # carries the release version (not the unstamped fallback), and
          # actually linked the sqlite driver the Makefile ships.
          echo "smoke test: toktop_${VERSION}_linux_amd64"
          bin="./dist/toktop_${VERSION}_linux_amd64"
          test "$("$bin" --version)" = "toktop $VERSION"
          set +e
          smoke="$("$bin" --agents --opencode-db --once --demo --frames 1 --no-hot-reload 2>&1)"
          status=$?
          set -e
          if printf '%s\n' "$smoke" | grep -F -q 'needs a build with -tags sqlite'; then
            echo "release binary is missing the sqlite tag" >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$smoke" >&2
            echo "smoke run of $bin failed" >&2
            exit 1
          fi
          # The publish step uploads exactly what dist/ holds, read back from
          # the filesystem after the build rather than spelled out a second
          # time here. A second copy of the platform list would let a platform
          # build, checksum, and then never be published, and
          # fail_on_unmatched_files is silent about a missing entry.
          {
            echo 'artifacts<<GITHUB_OUTPUT_EOF'
            find dist -maxdepth 1 -type f -printf '%p\n' | sort
            echo GITHUB_OUTPUT_EOF
          } >> "$GITHUB_OUTPUT"

      - name: publish github release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.build.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: ${{ steps.build.outputs.artifacts }}
