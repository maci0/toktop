name: release

on:
  push:
    tags: ["v*"]

# Actions accepts permissions on the workflow or the job, not on a step.
# The publish step uploads the release, so the job that contains it holds
# contents: write. The workflow sets none, so a job added beside this one starts
# from the read-only default the other workflows' jobs run under rather than
# inheriting the token this one needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # vet-cross analyzes six platforms, the race tests run both sqlite halves,
    # the reproducibility gate builds two platforms twice from cold build
    # caches, and the restore step fetches every published asset back. 50
    # minutes covers the four together with the build of every release
    # platform.
    timeout-minutes: 50
    # The Makefile's build exports, spelled here because `make` applies them
    # only to its own recipes: a `go env -w` on the runner image, an inherited
    # GOEXPERIMENT, a GOPRIVATE that skips the checksum database, or a go.work
    # above the checkout would move
    # the bytes this job publishes without moving anything in the repository.
    # `make check-ci-env` (run by ci.yml on every PR) fails when this block and
    # the Makefile's exports disagree on a name or a value.
    env:
      LC_ALL: C
      TZ: UTC
      GOAMD64: v1
      GOARM64: v8.0
      GOFIPS140: "off"
      CGO_ENABLED: "0"
      GOFLAGS: ""
      GOEXPERIMENT: ""
      GODEBUG: ""
      GOENV: "off"
      GOWORK: "off"
      GOPRIVATE: ""
      GONOSUMDB: ""
      GOINSECURE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # `make check-api` diffs the exported surface against the last
          # released tag, which it reads out of the commit before HEAD. The
          # default fetch-depth: 1 carries neither that commit nor the tags,
          # so the gate compared nothing and exited 0: a release could remove
          # an exported symbol and publish. Full history is what makes the
          # gate answerable, and this job is the only one that needs it.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: refuse a version that is already published
        # A moved tag re-runs this job and would otherwise replace the binaries,
        # checksums and SBOM under a version people have already installed and
        # verified, so a download and its recorded checksum stop agreeing. The
        # tag is a version, not a branch: it is cut once and left alone. This
        # runs before the gates so a duplicate fails without building.
        # A publish that failed before the release existed leaves nothing here,
        # so a retry is still allowed.
        # gh reads a token from the environment, never from the git config
        # checkout writes (persist-credentials is off), so without GH_TOKEN
        # every call here fails on auth and the guard passes anything.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh release view "$GITHUB_REF_NAME" 2>&1); then
            echo "$GITHUB_REF_NAME is already published; cut a new version instead" >&2
            exit 1
          fi
          # Only "this version was never published" is allowed through. An auth
          # failure, a rate limit or an outage must not read as a free version.
          case "$out" in
            *"HTTP 404"*|*"not found"*) ;;
            *)
              echo "cannot tell whether $GITHUB_REF_NAME is published:" >&2
              printf '%s\n' "$out" >&2
              exit 1
              ;;
          esac

      - name: vet and staticcheck before shipping (every release platform)
        # Per-platform gate lives in the Makefile; PLATFORMS there is the
        # single source of truth so CI and local checks cannot drift apart.
        run: make vet-cross

      - name: test before shipping
        # make test covers both halves of the sqlite tag gate; the artifacts
        # below are built with TAGS=sqlite, so shipping without that half would
        # leave the linked driver untested in this job.
        run: make test

      # The Makefile promises byte-identical artifacts from identical source.
      # The pull-request `repro` job guards main, but a tag push runs here
      # only, so the bytes about to be published have to be compared in the
      # job that publishes them. repro-check-pair is the target the PR gate
      # runs over the Makefile's REPRO_PLATFORMS, so this job and that one
      # cannot drift onto different platforms; the full sweep is local.
      - name: reproducibility gate (REPRO_PLATFORMS)
        run: make repro-check-pair

      - name: build all platforms
        id: build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Tag names reach ldflags and dist filenames; refuse anything that
          # is not a safe identifier so a v* glob cannot inject the recipe.
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._+-]+$'; then
            echo "refusing to release from tag '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          prerelease=false
          if [[ "${VERSION%%+*}" == *-* ]]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          # Platform list, checksum generation and deterministic archive
          # metadata live in the Makefile so local and CI releases cannot
          # drift apart.
          make release VERSION="$VERSION"
          # smoke test the host-platform artifact: proves the binary runs,
          # carries the release version (not the unstamped fallback), and
          # actually linked the sqlite driver the Makefile ships. The path
          # comes from the Makefile, which owns the artifact naming and
          # PLATFORMS; a second copy of that rule here would smoke test a
          # file no build wrote, and the failure would read as a broken
          # build rather than as a renamed artifact.
          bin="./$(make --no-print-directory host-dist VERSION="$VERSION")"
          echo "smoke test: $bin"
          test "$("$bin" --version)" = "toktop $VERSION"
          set +e
          smoke="$("$bin" --agents --opencode-db --once --demo --frames 1 --no-hot-reload 2>&1)"
          status=$?
          set -e
          if printf '%s\n' "$smoke" | grep -F -q 'needs a build with -tags sqlite'; then
            echo "release binary is missing the sqlite tag" >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$smoke" >&2
            echo "smoke run of $bin failed" >&2
            exit 1
          fi
          # The publish step uploads exactly what dist/ holds, read back from
          # the filesystem after the build rather than spelled out a second
          # time here. A second copy of the platform list would let a platform
          # build, checksum, and then never be published, and
          # fail_on_unmatched_files is silent about a missing entry.
          {
            echo 'artifacts<<GITHUB_OUTPUT_EOF'
            find dist -maxdepth 1 -type f -printf '%p\n' | sort
            echo GITHUB_OUTPUT_EOF
          } >> "$GITHUB_OUTPUT"

      - name: publish github release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.build.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: ${{ steps.build.outputs.artifacts }}

      - name: restore what was published
        # The upload exiting zero is not proof the assets are there:
        # fail_on_unmatched_files reports a glob that matched nothing, not an
        # asset that never arrived, and a step killed after the release exists
        # leaves the guard above refusing every retry of that tag. So the
        # version that just shipped is fetched back the way a client fetches
        # it, asset list against PLATFORMS and every digest against the
        # release's own checksums.txt. A partial publish fails here, loudly,
        # while the version is one nobody has installed yet.
        run: make release-verify VERSION="${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
          # The repository this run belongs to, not the module path in go.mod:
          # a fork that kept the upstream module path would otherwise verify
          # the upstream's release instead of its own.
          RELEASE_REPO: ${{ github.repository }}

  attest:
    # Provenance for the bytes the release job published, in its own job so
    # the token that signs them is never in the job that builds them:
    # id-token: write mints an OIDC token for every step in the job it is
    # granted to, and the release job runs `go run` against the module proxy
    # and `sh` out of the Makefile. This job checks out the same tag, fetches
    # the published assets the way a downloader does, and attests those bytes.
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: fetch what was published
        # The same repository this run belongs to, for the reason the restore
        # step names: a fork that kept the upstream module path would
        # otherwise attest, or verify, the upstream's release.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --repo "$RELEASE_REPO" --dir dist --clobber

      - name: attest the published assets
        # One SLSA provenance entry per published file, signed with the
        # repository's OIDC identity and recorded in the transparency log,
        # so a downloader can check the bytes against a public log entry
        # rather than against a checksum file on the same page as the bytes.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
