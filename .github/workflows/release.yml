name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C
      TZ: UTC
      GOAMD64: v1
      GOARM64: v8.0
      GOFLAGS: ""
      GOEXPERIMENT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: vet and staticcheck before shipping (every release platform)
        # Per-platform gate lives in the Makefile; PLATFORMS there is the
        # single source of truth so CI and local checks cannot drift apart.
        run: make vet-cross

      - name: test before shipping
        # make test covers both halves of the sqlite tag gate; the artifacts
        # below are built with TAGS=sqlite, so shipping without that half would
        # leave the linked driver untested in this job.
        run: make test

      - name: build all platforms
        id: build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Tag names reach ldflags and dist filenames; refuse anything that
          # is not a safe identifier so a v* glob cannot inject the recipe.
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._+-]+$'; then
            echo "refusing to release from tag '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          prerelease=false
          if [[ "${VERSION%%+*}" == *-* ]]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          # Platform list, checksum generation and deterministic archive
          # metadata live in the Makefile so local and CI releases cannot
          # drift apart.
          make release VERSION="$VERSION"
          # smoke test the host-platform artifact: proves the binary runs,
          # carries the release version (not the unstamped fallback), and
          # actually linked the sqlite driver the Makefile ships.
          echo "smoke test: toktop_${VERSION}_linux_amd64"
          bin="./dist/toktop_${VERSION}_linux_amd64"
          test "$("$bin" --version)" = "toktop $VERSION"
          set +e
          smoke="$("$bin" --agents --opencode-db --once --demo --frames 1 --no-hot-reload 2>&1)"
          status=$?
          set -e
          if printf '%s\n' "$smoke" | grep -F -q 'needs a build with -tags sqlite'; then
            echo "release binary is missing the sqlite tag" >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$smoke" >&2
            echo "smoke run of $bin failed" >&2
            exit 1
          fi

      - name: generate dependency sbom
        run: make sbom VERSION="$VERSION"

      - name: publish github release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.build.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/toktop_${{ env.VERSION }}_linux_amd64
            dist/toktop_${{ env.VERSION }}_linux_arm64
            dist/toktop_${{ env.VERSION }}_darwin_amd64
            dist/toktop_${{ env.VERSION }}_darwin_arm64
            dist/toktop_${{ env.VERSION }}_windows_amd64.exe
            dist/toktop_${{ env.VERSION }}_windows_arm64.exe
            dist/toktop_${{ env.VERSION }}_checksums.tar.gz
            dist/toktop-sbom-${{ env.VERSION }}.cdx.json
