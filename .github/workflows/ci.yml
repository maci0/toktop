name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Match the Makefile: locale/timezone must not follow the runner into
# formatting, glob order, or timestamps. Instruction-set baselines, the
# non-FIPS crypto module and CGO_ENABLED=0 match the released artifacts;
# race-test steps turn cgo on. Empty GOFLAGS/GOEXPERIMENT/GODEBUG so a
# runner-level extra flag cannot change compile or test results relative to
# `make`. GOENV=off, GOWORK=off and the empty
# GOPRIVATE/GONOSUMDB/GOINSECURE keep the go
# command off the runner's own config file, out of workspace mode, and off the
# checksum database, which
# is what the Makefile exports for the steps that go through it. `make
# check-ci-env` fails when these and the Makefile's exports stop agreeing.
env:
  LC_ALL: C
  TZ: UTC
  GOAMD64: v1
  GOARM64: v8.0
  GOFIPS140: "off"
  CGO_ENABLED: "0"
  GOFLAGS: ""
  GOEXPERIMENT: ""
  GODEBUG: ""
  GOENV: "off"
  GOWORK: "off"
  GOPRIVATE: ""
  GONOSUMDB: ""
  GOINSECURE: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    # Raised from 20 for the Linux address-sanitizer step. -asan is a
    # different build of every package, so it shares none of the race run's
    # build cache: the SQLite driver alone recompiles from scratch, and a
    # timeout here kills a job that would have passed. The extra 10 minutes is
    # only spent on ubuntu; the macOS and Windows legs run the same steps as
    # before.
    timeout-minutes: 30
    # bash on Windows too: pwsh does not fail the step when a native command
    # in a multi-line script returns non-zero, so the last staticcheck/vet
    # could hide an earlier failure.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt -s (linux only; formatting is platform-independent)
        if: runner.os == 'Linux'
        run: |
          unformatted=$("$(go env GOROOT)/bin/gofmt" -s -l .)
          if [ -n "$unformatted" ]; then
            echo "needs gofmt -s:"; echo "$unformatted"; exit 1
          fi
      - name: go.mod/go.sum matches source (linux only)
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      # The go lines in this job spell out what the Makefile targets run, so
      # the tags those targets pass have to be on the lines too. Before the
      # static analysis and the tests, so a line that lost one is named here
      # rather than as a result that only differs in CI. Linux only, and it
      # covers the other two runners: the matrix shares one block of YAML.
      - name: the go lines in this job carry the Makefile's tags
        if: runner.os == 'Linux'
        run: make check-ci-tags
      # The same guards for the Makefile's own `go test` lines. A tag value
      # glued to the next flag is not a missing flag but a different
      # argument, so a RACE=0 run can silently test a binary without the
      # embedded zone database and without a shuffled order, and only the
      # RACE=1 path stays right. Linux only: it reads the Makefile, which is
      # one file for all three runners.
      - name: the Makefile's go test lines carry the zone tag and -shuffle=on
        if: runner.os == 'Linux'
        run: make check-test-flags
      # The env block above is a copy of the build inputs the Makefile
      # exports, and the copy is what every `go` step here reads: `make`
      # applies those exports to its own recipes, not to the workflow. A key
      # dropped from one side leaves the runner's own value reaching the
      # compiler, so the two copies have to be answerable to each other.
      - name: the workflow env block matches the Makefile's build exports
        if: runner.os == 'Linux'
        run: make check-ci-env
      # The build matrix below is a copy of the Makefile's PLATFORMS, so the
      # two can drift: the release job builds and publishes PLATFORMS while
      # this workflow vets and compiles whatever the matrix lists.
      - name: the build matrix below is the Makefile's PLATFORMS
        if: runner.os == 'Linux'
        run: make check-ci-platforms
      # The fourth doc guard: a target added to CONTRIBUTING.md's table
      # without the '## ' comment is missing from `make help`, so the run that
      # is supposed to find it is the one that never learns the name.
      - name: every documented make target is in make help (linux only)
        if: runner.os == 'Linux'
        run: make check-help-docs
      # The changelog's shape, not one release's contents: an impact heading
      # repeated inside a section means the entries under the second one ship
      # unlabelled, and the only other place that refuses it is the cut, which
      # runs once the notes are already written. Pure text, so it belongs
      # beside the other guards and not behind the release gates.
      - name: no changelog section repeats an impact heading (linux only)
        if: runner.os == 'Linux'
        run: make check-changelog-structure
      # yamllint over the workflows runs in the scripts job below, which
      # already has uv and the pinned tool env this target installs from. The
      # workflow file is the one thing in this repo no Go analyzer reads, and a
      # YAML error there is a gate that stops running rather than one that
      # fails, so the gate is the Python one and the Python env it needs.
      # staticcheck resolves build tags per GOOS, so every runner analyzes its
      # own platform-specific files; the linux pass plus the matrix below
      # together cover all of them. The module pins the analyzer via a tool
      # directive; `go tool` runs that pin without a second version string.
      - name: staticcheck
        run: |
          go tool staticcheck -tags timetzdata ./...
          go tool staticcheck -tags "sqlite timetzdata" ./agentusage/...
      - name: vet
        run: |
          go vet -mod=readonly -tests=true -tags timetzdata ./...
          go vet -mod=readonly -tests=true -tags "sqlite timetzdata" ./agentusage/...
      # The bash completion script is shell code this repo prints and a user
      # sources, and no Go analyzer reads it. shellcheck is in the ubuntu image;
      # `make check-shell` refuses an older one rather than reporting a pass
      # from a rule set that predates the script's own disable comment. Linux
      # only: the script is the same bytes from the same source on every runner.
      - name: shellcheck (linux only)
        if: runner.os == 'Linux'
        run: make check-shell
      - name: govulncheck (linux only; both sqlite tag halves)
        if: runner.os == 'Linux'
        # Makefile GOVULNCHECK is the only version string; `go run @version`
        # so PATH does not have to carry a go-install.
        run: make govulncheck
      - name: test
        # Race tests need cgo; do not inherit the workflow CGO_ENABLED=0.
        env:
          CGO_ENABLED: "1"
        run: go test -mod=readonly -tags timetzdata -race -shuffle=on ./...
      # The sqlite tag links a database driver for crush and opencode, so
      # both halves of that gate have their own tests and both must pass.
      - name: test (sqlite build)
        env:
          CGO_ENABLED: "1"
        run: go test -mod=readonly -tags "sqlite timetzdata" -race -shuffle=on ./agentusage/...
      # The address sanitizer, the same second run of `make test-asan`. It
      # cannot share a command line with -race, so it is a step of its own
      # rather than a flag on the two above, and it wants cgo for the
      # runtime's shadow memory for the same reason. Linux only: the two
      # release artifacts every other runner compiles are the same bytes from
      # the same source, and an out-of-bounds access in a decoder does not
      # depend on the host it runs on.
      - name: test (address sanitizer)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: make test-asan

  # The site worker and the screenshot script ship in this repo, so they gate
  # here too: their tests and checks ran nowhere before.
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version-file: ".bun-version"
      # The wrangler pin and the deploy command the docs name have to move
      # together. check-wrangler-doc runs at deploy time today, so a doc that
      # stops naming the pin merges and then fails the next `make site-deploy`.
      # First in the job: two greps, and it is the only gate here that needs
      # nothing from the network, so a pin that drifted from the docs fails in
      # seconds instead of after the biome download and the test run.
      - run: make check-wrangler-doc
      - run: make site-lint
      - run: make site-check

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7   # v10.2.0
        with:
          # setup-uv v10 parses only the formats it documents (uv.toml,
          # pyproject.toml, .tool-versions, requirements files, uv.lock); an
          # arbitrary name like .uv-version is rejected outright. The Makefile
          # reads the uv line of the same file, so one string still covers both.
          version-file: ".tool-versions"
          enable-cache: true
          cache-dependency-glob: |
            scripts/requirements.txt
            scripts/requirements-dev.txt
      - name: yamllint over the workflows
        # The Makefile's own guard for the one file in this repo no other
        # analyzer reads, and the pin lives in scripts/requirements-dev.txt
        # with the rest of this job's tools.
        run: make check-yaml
      - name: format, lint and type-check the screenshot script
        # Pins live in scripts/requirements-dev.txt so local `make scripts-check`
        # and CI cannot run different black/ruff/mypy versions.
        run: make scripts-check

  # The Makefile promises byte-identical artifacts from identical source. Two
  # builds of each shipped platform under different paths, build caches,
  # locales, and timezones are the only way to find out whether the promise
  # still holds. A representative pair keeps this under the job budget; the
  # local `make repro-check` covers all of PLATFORMS.
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make repro-check-pair

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Host binary from the go.mod tool pin (same as `make vet-cross`).
      # Installing with GOOS set would produce a tool for the analyzed
      # platform instead of the analyzer.
      - name: install staticcheck (host binary; GOOS picks the analyzed platform)
        run: go install tool
      - name: vet and staticcheck ${{ matrix.goos }}/${{ matrix.goarch }} (platform-specific files)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go vet -mod=readonly -tests=true -tags timetzdata ./...
          go vet -mod=readonly -tests=true -tags "sqlite timetzdata" ./agentusage/...
          staticcheck -tags timetzdata ./...
          staticcheck -tags "sqlite timetzdata" ./agentusage/...
      - name: compile ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # Same flags as `make build` (GO_BUILDFLAGS, ldflags, CGO off). TAGS=
        # is the no-driver half of the sqlite gate; the next step is the
        # released default. BINARY=/dev/null is a compile check, not an artifact.
        run: make build TAGS= BINARY=/dev/null
      - name: compile ${{ matrix.goos }}/${{ matrix.goarch }} with sqlite
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build BINARY=/dev/null
